services:
    laravel.test:
        build:
            context: .
            dockerfile: Dockerfile
        image: 'afalina/app'
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            # Caddy (below) is the sole public ingress in production, so
            # this is for local Vite HMR access only. If you need to hit
            # this container directly (bypassing Caddy/TLS) for debugging,
            # set APP_PORT in .env and add back '${APP_PORT}:80' here.
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
    # Queued jobs (TranslateBookingDetails, DispatchBookingWebhook — see
    # CallbackRequestObserver) need a real worker process; the app
    # container above only runs `artisan serve`, never `queue:work`.
    # Same built image as laravel.test, so nothing to build here.
    queue:
        image: 'afalina/app'
        restart: unless-stopped
        entrypoint: ['php', '/var/www/html/artisan', 'queue:work', '--tries=3']
        environment:
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
    # Inertia SSR (config/inertia.php: ssr.enabled) needs its own
    # long-running node process serving bootstrap/ssr/app.js — the file
    # `vp build --ssr` actually emits, not `ssr.js`.
    ssr:
        image: 'afalina/app'
        restart: unless-stopped
        entrypoint: ['node', '/var/www/html/bootstrap/ssr/app.js']
        environment:
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
    pgsql:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    # Terminates TLS and automatically gets/renews a Let's Encrypt
    # certificate for the domain in docker/Caddyfile - the only service
    # publishing 80/443, reverse-proxying everything to laravel.test over
    # the internal network. Needs that domain's DNS A record pointed at
    # this VPS before Let's Encrypt can issue a cert for it.
    caddy:
        image: 'caddy:2-alpine'
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - './docker/Caddyfile:/etc/caddy/Caddyfile'
            - 'caddy-data:/data'
            - 'caddy-config:/config'
        networks:
            - sail
        depends_on:
            - laravel.test
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    caddy-data:
        driver: local
    caddy-config:
        driver: local
